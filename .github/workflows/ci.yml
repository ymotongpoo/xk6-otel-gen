name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-build-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race -count=1 ./...

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff #v24.2.0
        with:
          globs: "**/*.md"
      - name: Check multiple-choice options are blank-line separated (issue #246)
        run: |
          # Multiple-choice options like "A) ..." on consecutive lines without
          # a blank-line separator collapse into a single paragraph in strict
          # CommonMark renderers (IntelliJ/PyCharm preview). Scope mirrors the
          # markdownlint ignores in .markdownlint-cli2.yaml.
          matches=$(find . -name '*.md' \
            -not -path './node_modules/*' \
            -not -path './.claude/*' \
            -not -path './.git/*' \
            -not -name 'CHANGELOG.md' \
            -print | xargs awk '
              FNR == 1 { prev_is_option = 0 }
              /^[A-Z]\) / && prev_is_option { print FILENAME ":" FNR ": " $0 }
              { prev_is_option = /^[A-Z]\) / }
            ')
          if [ -n "$matches" ]; then
            echo "Found multiple-choice options on consecutive lines without blank-line separators."
            echo "Add a blank line between each option so CommonMark renderers display them on separate lines."
            echo "$matches"
            exit 1
          fi
